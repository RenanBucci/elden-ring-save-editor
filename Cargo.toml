[workspace]
resolver = "2"
members = ["crates/er-save", "crates/er-gamedata", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Elden Ring Save Editor"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
